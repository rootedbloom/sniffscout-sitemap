name: Update SniffScout sitemap

on:
  schedule:
    - cron: "17 7 * * *" # every night around 2:17 AM Eastern
  workflow_dispatch: {}  # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build sitemap from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node build-sitemap.mjs
      - name: Save changes
        run: |
          if git diff --quiet; then
            echo "Sitemap already up to date."
          else
            git config user.name "sniffscout-bot"
            git config user.email "sniffscout-bot@users.noreply.github.com"
            git add sitemap-listings.xml
            git commit -m "Nightly sitemap update"
            git push
          fi
